name: Verify

"on":
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    name: lifecycle-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./scripts/verify
