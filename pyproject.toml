[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-lifecycle"
version = "0.2.0"
description = "Shared engineering lifecycle CLI"
requires-python = ">=3.11"

[project.scripts]
eng-lifecycle = "eng_lifecycle.cli:main"
eng-metadata = "eng_lifecycle.metadata:main"

[tool.setuptools.packages.find]
where = ["src"]
